<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C2FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00C2FF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#7B2FF7"/>
      <stop offset="0.75" stop-color="#FF2E97" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
  </defs>
  <rect x="40" y="13" width="820" height="2" rx="1" fill="url(#line)"/>
  <rect x="-120" y="12.5" width="120" height="3" rx="1.5" fill="url(#shine)">
    <animate attributeName="x" values="-120;900" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="444" y="8" width="12" height="12" rx="2" fill="url(#gem)" transform="rotate(45 450 14)">
    <animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
