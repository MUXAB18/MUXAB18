<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Player card for Musab Iftikhar with profile details and skill bars">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="338" rx="20" fill="url(#bg)" stroke="#30363d"/>

  <g font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif">
    <!-- section labels -->
    <text x="40" y="44" font-size="12" font-weight="700" letter-spacing="3" fill="#00C2FF">PLAYER CARD</text>
    <text x="520" y="44" font-size="12" font-weight="700" letter-spacing="3" fill="#8b949e">SKILLS</text>
    <line x1="490" y1="40" x2="490" y2="300" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- avatar + name -->
    <circle cx="96" cy="108" r="40" fill="#0d1117" stroke="url(#accent)" stroke-width="3"/>
    <text x="96" y="122" text-anchor="middle" font-size="38" font-weight="800" fill="url(#accent)">M</text>
    <text x="156" y="102" font-size="26" font-weight="700" fill="#ffffff">Musab Iftikhar</text>
    <text x="156" y="128" font-size="14" fill="#9da7b3">Software Engineer · Full-Stack Developer</text>

    <line x1="40" y1="168" x2="460" y2="168" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- details -->
    <g font-size="11" font-weight="600" letter-spacing="1.5" fill="#8b949e">
      <text x="40" y="204">ROLE</text>
      <text x="40" y="236">BASED IN</text>
      <text x="40" y="268">FOCUS</text>
      <text x="40" y="300">STATUS</text>
    </g>
    <g font-size="15" fill="#e6edf3">
      <text x="150" y="205">Software Engineer</text>
      <text x="150" y="237">Lahore, Pakistan</text>
      <text x="150" y="269">Web Development &amp; AI</text>
    </g>
    <circle cx="156" cy="295" r="4.5" fill="#3DDC84">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="168" y="301" font-size="15" font-weight="600" fill="#3DDC84">Open to opportunities</text>

    <!-- skill labels -->
    <g font-size="14" font-weight="600" fill="#e6edf3">
      <text x="520" y="96">Full-Stack Development</text>
      <text x="520" y="150">Data Structures &amp; Algorithms</text>
      <text x="520" y="204">AI / Machine Learning</text>
      <text x="520" y="258">Open Source</text>
    </g>
    <g font-size="14" font-weight="700" fill="#00C2FF" text-anchor="end">
      <text x="860" y="96">80%</text>
      <text x="860" y="150">65%</text>
      <text x="860" y="204">40%</text>
      <text x="860" y="258">30%</text>
    </g>

    <!-- bar tracks -->
    <g fill="#ffffff" fill-opacity="0.08">
      <rect x="520" y="106" width="340" height="8" rx="4"/>
      <rect x="520" y="160" width="340" height="8" rx="4"/>
      <rect x="520" y="214" width="340" height="8" rx="4"/>
      <rect x="520" y="268" width="340" height="8" rx="4"/>
    </g>

    <!-- bar fills (grow once on load) -->
    <rect x="520" y="106" width="272" height="8" rx="4" fill="url(#bar)">
      <animate attributeName="width" values="0;0;272" keyTimes="0;0.01;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" dur="1.6s" fill="freeze"/>
    </rect>
    <rect x="520" y="160" width="221" height="8" rx="4" fill="url(#bar)">
      <animate attributeName="width" values="0;0;221" keyTimes="0;0.13;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" dur="1.6s" fill="freeze"/>
    </rect>
    <rect x="520" y="214" width="136" height="8" rx="4" fill="url(#bar)">
      <animate attributeName="width" values="0;0;136" keyTimes="0;0.25;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" dur="1.6s" fill="freeze"/>
    </rect>
    <rect x="520" y="268" width="102" height="8" rx="4" fill="url(#bar)">
      <animate attributeName="width" values="0;0;102" keyTimes="0;0.37;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" dur="1.6s" fill="freeze"/>
    </rect>

    <text x="860" y="306" font-size="11" fill="#8b949e" text-anchor="end">self-assessed</text>
  </g>
</svg>
