<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Musab Iftikhar, Software Engineer and Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="898" height="258" rx="20"/></clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="898" height="258" rx="20" fill="url(#bg)" stroke="#30363d"/>
  <g clip-path="url(#card)">
    <rect x="540" y="0" width="360" height="260" fill="url(#dots)"/>
    <circle cx="775" cy="130" r="170" fill="url(#glow)"/>
  </g>

  <!-- logo tile -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="5s" repeatCount="indefinite"/>
    <rect x="725" y="80" width="100" height="100" rx="24" fill="none" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="2" transform="rotate(12 775 130)"/>
    <rect x="725" y="80" width="100" height="100" rx="24" fill="none" stroke="url(#accent)" stroke-opacity="0.25" stroke-width="2" transform="rotate(-12 775 130)"/>
    <rect x="725" y="80" width="100" height="100" rx="24" fill="url(#accent)"/>
    <text x="775" y="142" text-anchor="middle" font-family="'Fira Code',Consolas,Menlo,monospace" font-size="34" font-weight="700" fill="#ffffff">&lt;/&gt;</text>
  </g>

  <!-- text -->
  <g font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif">
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>
    <rect x="50" y="52" width="44" height="4" rx="2" fill="url(#accent)"/>
    <text x="50" y="86" font-size="13" font-weight="600" letter-spacing="3" fill="#00C2FF">FULL-STACK DEVELOPER</text>
    <text x="50" y="146" font-size="56" font-weight="800" letter-spacing="-1" fill="#ffffff">Musab Iftikhar</text>
    <text x="50" y="182" font-size="19" fill="#9da7b3">Software Engineer building modern web &amp; mobile apps.</text>

    <!-- skill pills -->
    <g font-size="14" font-weight="500" fill="#c9d1d9" text-anchor="middle">
      <rect x="50" y="205" width="72" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="86" y="226">React</text>
      <rect x="132" y="205" width="88" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="176" y="226">Next.js</text>
      <rect x="230" y="205" width="112" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="286" y="226">TypeScript</text>
      <rect x="352" y="205" width="88" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="396" y="226">Node.js</text>
    </g>

    <!-- status pill -->
    <rect x="464" y="205" width="210" height="32" rx="16" fill="#3DDC84" fill-opacity="0.12" stroke="#3DDC84" stroke-opacity="0.5"/>
    <circle cx="486" cy="221" r="4.5" fill="#3DDC84">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="500" y="226" font-size="14" font-weight="600" fill="#3DDC84">Open to opportunities</text>
  </g>
</svg>
